name: CI

# Pull requests run once (pull_request); pushes run only on the long-lived branches, so
# a pushed branch with an open pull request is not checked twice.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run validate:content
      - run: npm run test
      - run: npm run build

      # The end-to-end tests (npm run test:e2e) run locally before each push, not here:
      # without a GPU they take several minutes on the runner and are timing-sensitive.

      - name: Upload room review images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: room-reports
          path: reports/
          retention-days: 14
