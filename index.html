<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Words</title>
  </head>
  <body>
    <div id="app" data-screen="start">
      <aside id="hud">
        <p id="prompt" data-testid="prompt" aria-live="polite"></p>
        <p id="feedback" data-testid="feedback" aria-live="polite"></p>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">Correct</span>
            <span class="stat-value" id="score" data-testid="score">0 / 0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Time</span>
            <span class="stat-value" id="timer" data-testid="timer">0:00</span>
          </div>
        </div>
      </aside>

      <main id="game-container"></main>

      <section id="start-screen" class="overlay" data-for="start">
        <div class="card">
          <h1>Words</h1>
          <p>Find the things in the room!</p>
          <button type="button" id="start-button">Start</button>
        </div>
      </section>

      <section id="loading-screen" class="overlay" data-for="loading">
        <div class="card"><p>Loading…</p></div>
      </section>

      <section id="summary-screen" class="overlay" data-for="summary">
        <div class="card">
          <h2>Well done!</h2>
          <p id="summary-text" data-testid="summary"></p>
          <p id="summary-time"></p>
          <button type="button" id="play-again-button">Play again</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
